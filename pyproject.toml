[project]
name = "resqlink-cloudflare-free"
version = "0.5.0"
description = "ResQLink FastAPI API running on Cloudflare Workers Free"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
