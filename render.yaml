services:
  - type: web
    name: resqlink-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: AI_ENABLED
        value: "true"
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_REQUEST_TIMEOUT_SECONDS
        value: "14"
      - key: AI_TOTAL_TIMEOUT_SECONDS
        value: "30"
      - key: SACHET_SYNC_ENABLED
        value: "true"
      - key: SACHET_REFRESH_SECONDS
        value: "300"
      - key: IP_GEOLOCATION_ENABLED
        value: "false"
      - key: WEATHER_CACHE_TTL_SECONDS
        value: "600"
      - key: LOG_LEVEL
        value: INFO
